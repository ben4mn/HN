<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>HN Reader — a fast, readable Hacker News client</title>
  <meta name="description" content="Read Hacker News without the squint: a clean article reader, threaded comments you can collapse, and a desktop view with the story and its discussion side by side. Free, no account, installs as an app.">
  <link rel="canonical" href="https://hn.4mn.org/">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="author" content="Ben">

  <!-- Link previews: iMessage, Threads, X, Slack, Discord all read these -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HN Reader">
  <meta property="og:title" content="HN Reader — Hacker News, made readable">
  <meta property="og:description" content="A clean article reader, threaded comments, and a desktop split view for Hacker News. Free, no account, works offline.">
  <meta property="og:url" content="https://hn.4mn.org/">
  <meta property="og:image" content="https://hn.4mn.org/static/icons/og.png">
  <meta property="og:image:secure_url" content="https://hn.4mn.org/static/icons/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="HN Reader: a glowing orange upvote mark over story lines, with the tagline Hacker News, readable.">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HN Reader — Hacker News, made readable">
  <meta name="twitter:description" content="A clean article reader, threaded comments, and a desktop split view for Hacker News. Free, no account, works offline.">
  <meta name="twitter:image" content="https://hn.4mn.org/static/icons/og.png">
  <meta name="twitter:image:alt" content="HN Reader: a glowing orange upvote mark over story lines.">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "HN Reader",
    "alternateName": "HN — Hacker News reader",
    "url": "https://hn.4mn.org/",
    "description": "A fast, readable Hacker News client with a clean article reader, threaded collapsible comments, search, saved stories, and a desktop view that shows a story and its discussion side by side.",
    "applicationCategory": "NewsApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "image": "https://hn.4mn.org/static/icons/og.png",
    "author": { "@type": "Person", "name": "Ben", "url": "https://4mn.org" },
    "isBasedOn": "https://news.ycombinator.com/",
    "codeRepository": "https://github.com/ben4mn/HN"
  }
  </script>
  <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HN">
  <!-- "default" (not black-translucent): on iOS 26 the translucent mode reports a window that is the status-bar height too short, which floats fixed-bottom bars. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="static/icons/favicon.ico" sizes="16x16 32x32 64x64">
  <link rel="icon" type="image/svg+xml" href="static/icons/icon.svg">
  <link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
  <link rel="preload" href="static/fonts/Figtree-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = (localStorage.getItem('hn_theme') || '').replace(/"/g, '');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <h1 class="sr-only">HN Reader — a fast, readable Hacker News client</h1>
  <noscript>
    <div class="nojs">
      <p><strong>HN Reader</strong> is a free, readable client for <a href="https://news.ycombinator.com/">Hacker News</a>: a clean article reader, threaded comments you can collapse, search, saved stories, and a desktop layout with the story and its discussion side by side. It needs JavaScript to run.</p>
    </div>
  </noscript>
  <div id="app" class="app">

    <!-- ===== Feed pane ===== -->
    <aside id="feed" class="feed">
      <header class="feed-head">
        <a class="brand" href="#/top" aria-label="HN home">
          <img class="brand-mark" src="static/icons/icon.svg" alt="" width="26" height="26">
          <span class="brand-word">HN</span>
          <span class="brand-tag">reader</span>
        </a>
        <div class="head-actions">
          <button class="icon-btn" id="btn-search" aria-label="Search" title="Search (/)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
          <button class="icon-btn" id="btn-saved" aria-label="Saved stories" title="Saved">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          </button>
          <button class="icon-btn" id="btn-theme" aria-label="Toggle theme" title="Theme">
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          </button>
          <button class="icon-btn" id="btn-refresh" aria-label="Refresh" title="Refresh (r)">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 21v-5h-5"/></svg>
          </button>
        </div>
      </header>

      <nav class="feed-tabs" id="feed-tabs" aria-label="Feeds">
        <a class="tab" data-feed="top" href="#/top">Top</a>
        <a class="tab" data-feed="new" href="#/new">New</a>
        <a class="tab" data-feed="best" href="#/best">Best</a>
        <a class="tab" data-feed="ask" href="#/ask">Ask</a>
        <a class="tab" data-feed="show" href="#/show">Show</a>
        <a class="tab" data-feed="jobs" href="#/jobs">Jobs</a>
        <a class="tab" data-feed="saved" href="#/saved">Saved</a>
      </nav>

      <form class="feed-search" id="feed-search" hidden role="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search stories…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="icon-btn small" id="search-close" aria-label="Close search">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </form>

      <div class="feed-scroll" id="feed-scroll">
        <div class="ptr" id="ptr" aria-hidden="true">
          <div class="ptr-glow"></div>
          <div class="ptr-disc">
            <svg class="ptr-ring" viewBox="0 0 40 40"><circle class="ptr-track" cx="20" cy="20" r="16"/><circle cx="20" cy="20" r="16"/></svg>
            <svg class="ptr-mark" viewBox="0 0 12 12"><path d="M6 1.4c.5 0 .9.3 1.2.9l4.2 7.4c.4.7 0 1.5-.8 1.5H1.4c-.8 0-1.2-.8-.8-1.5l4.2-7.4c.3-.6.7-.9 1.2-.9z"/></svg>
          </div>
        </div>
        <div class="feed-offline" id="feed-offline" hidden>Offline — showing what's cached.</div>
        <div class="feed-status" id="feed-status" hidden></div>
        <ol class="stories" id="story-list"></ol>
        <div class="feed-foot" id="feed-foot" hidden>
          <button class="btn" id="btn-more">Load more</button>
        </div>
      </div>
    </aside>

    <div class="col-resizer" data-resize="sidebar" role="separator" aria-orientation="vertical" aria-label="Resize feed column" title="Drag to resize · double-click to reset"></div>

    <!-- ===== Detail pane ===== -->
    <section id="detail" class="detail" aria-hidden="true">
      <header class="detail-head">
        <button class="icon-btn" id="btn-back" aria-label="Back" title="Back (esc)">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="seg" id="seg" role="tablist">
          <button class="seg-btn" data-pane="article" role="tab">Article</button>
          <button class="seg-btn" data-pane="comments" role="tab">Comments <span class="seg-count" id="seg-count"></span></button>
        </div>
        <div class="detail-actions">
          <div class="font-ctl" id="font-ctl">
            <button class="icon-btn small" data-font="-1" aria-label="Smaller text">A<sup>−</sup></button>
            <button class="icon-btn small" data-font="1" aria-label="Larger text">A<sup>+</sup></button>
          </div>
          <button class="icon-btn" id="btn-swap" aria-label="Swap article and comments" title="Swap article and comments (x)">
            <svg viewBox="0 0 24 24"><path d="M4 8h13"/><path d="M14 4l4 4-4 4"/><path d="M20 16H7"/><path d="M10 12l-4 4 4 4"/></svg>
          </button>
          <button class="icon-btn" id="btn-save" aria-label="Save story" title="Save (s)">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          </button>
          <button class="icon-btn" id="btn-share" aria-label="Share" title="Share">
            <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v8h14v-8"/></svg>
          </button>
          <a class="icon-btn" id="btn-open" href="#" target="_blank" rel="noopener" aria-label="Open original" title="Open original (o)">
            <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4L10 14"/><path d="M18 13v7H4V6h7"/></svg>
          </a>
        </div>
      </header>

      <div class="detail-body" id="detail-body">
        <article class="pane pane-article" id="pane-article">
          <div class="read-progress" id="read-progress"></div>
          <div class="pane-scroll" id="article-scroll"></div>
        </article>
        <div class="col-resizer" data-resize="split" role="separator" aria-orientation="vertical" aria-label="Resize article and comments" title="Drag to resize · double-click to reset"></div>
        <section class="pane pane-comments" id="pane-comments">
          <div class="pane-scroll" id="comments-scroll"></div>
          <button class="fab" id="btn-jump" aria-label="Next top-level comment" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </button>
        </section>
        <div class="detail-empty" id="detail-empty">
          <img src="static/icons/icon.svg" alt="" width="56" height="56">
          <p>Pick a story.</p>
          <p class="hint"><kbd>j</kbd><kbd>k</kbd> move · <kbd>↵</kbd> open · <kbd>c</kbd> comments · <kbd>o</kbd> original · <kbd>s</kbd> save · <kbd>/</kbd> search</p>
        </div>
      </div>
    </section>

    <!-- ===== Mobile tab bar ===== -->
    <nav class="tabbar" id="tabbar" aria-label="Feeds">
      <a class="tabbar-btn" data-feed="top" href="#/top"><svg viewBox="0 0 24 24"><path d="M12 4l8 14H4z"/></svg><span>Top</span></a>
      <a class="tabbar-btn" data-feed="new" href="#/new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>New</span></a>
      <a class="tabbar-btn" data-feed="best" href="#/best"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Best</span></a>
      <a class="tabbar-btn" data-feed="ask" href="#/ask"><svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4.5 2.6c-1 .6-1.5 1.2-1.5 2.4"/><circle cx="12" cy="18" r=".8"/><circle cx="12" cy="12" r="9.5"/></svg><span>Ask</span></a>
      <a class="tabbar-btn" data-feed="show" href="#/show"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg><span>Show</span></a>
    </nav>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast" hidden>
      <span id="toast-msg"></span>
      <button class="toast-btn" id="toast-btn" hidden></button>
    </div>
  </div>

  <script src="static/vendor/marked.min.js" defer></script>
  <script src="static/js/utils.js"></script>
  <script src="static/js/store.js"></script>
  <script src="static/js/extractive.js"></script>
  <script src="static/js/api.js"></script>
  <script src="static/js/feed.js"></script>
  <script src="static/js/reader.js"></script>
  <script src="static/js/thread.js"></script>
  <script src="static/js/gestures.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
